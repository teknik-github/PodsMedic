# The podsmedic workload. Settings and secret live in deploy/config.yaml, so
# re-applying this file to roll out a new image leaves your configuration alone.
#
#   kubectl apply -f deploy/config.yaml      # once
#   kubectl apply -f deploy/rbac.yaml
#   kubectl apply -f deploy/rbac-autoheal.yaml   # only with PODSMEDIC_AUTOHEAL=true
#   kubectl apply -f deploy/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podsmedic
  namespace: podsmedic
  labels:
    app.kubernetes.io/name: podsmedic
spec:
  # Single replica on purpose: the dedupe cache is in-memory, so two replicas
  # would double-alert on every problem.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: podsmedic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podsmedic
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: podsmedic
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podsmedic
          image: localhost:5000/podsmedic:v3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: podsmedic
            - secretRef:
                name: podsmedic
          ports:
            - name: metrics
              containerPort: 9090
            # Only listens when PODSMEDIC_UI_ADDR is set. Declared so
            # port-forward can name it; deliberately not behind a Service.
            - name: ui
              containerPort: 3456
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

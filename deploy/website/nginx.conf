# nginx for the PodsMedic landing page.
#
# The page is entirely self-contained — no CDN, no web fonts, no XHR — which is
# what lets the policy below be this strict rather than a decorative header.
# If a future edit adds an external asset, this file is where it will fail
# loudly, which is the intended behaviour.

# Cache policy is resolved here rather than in per-location blocks, and that is
# not a style choice. In nginx, an `add_header` anywhere inside a location
# *replaces* every add_header inherited from the server block — it does not
# merge. The first version of this file set the security headers at server level
# and Cache-Control inside three locations, which silently dropped the CSP and
# every other header from exactly the responses that mattered. Measured: the
# page came back with Cache-Control and nothing else.
#
# Keeping a single add_header scope makes that mistake impossible to repeat.
map $uri $cache_control {
    default        "no-cache";
    ~*\.(css|js)$  "public, max-age=300";
}

server {
    # 8080, not 80: the unprivileged image runs as a non-root user, which cannot
    # bind a privileged port. Compose maps the host port onto this.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    charset utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff"        always;
    add_header Referrer-Policy        "no-referrer"    always;
    add_header X-Frame-Options        "DENY"           always;
    # data: is needed for one thing only: the favicon is an inline SVG.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # HTML is revalidated every time so an edit shows up on reload. A stale page
    # quietly serving old JavaScript has looked exactly like a broken feature
    # twice in this project already.
    add_header Cache-Control          $cache_control   always;

    # Nothing here needs to be writable or executable.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

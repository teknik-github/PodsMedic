<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podsmedic — live</title>
<style>
  :root {
    --bg:#070a0f; --ink:#c8d4e4; --dim:#5a6a80; --rule:#16202e;
    --problem:#ff4d5e; --restart:#ffab3d; --recovery:#38d996;
    --diagnose:#4aa8ff; --heal:#38d996; --verify:#7ee0b8;
    --rollback:#ffab3d; --declined:#7b8aa0; --gone:#3d4a5c;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  /* width/height are required, not decorative. A <canvas> is a replaced element
     with an intrinsic 300x150, and for an absolutely positioned replaced element
     `width:auto` resolves to that intrinsic size — inset:0 does NOT stretch it.
     Without these the canvas sits 300x150 in the top-left corner and everything
     draws inside that box. */
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; cursor:default; }
  canvas.pick { cursor:pointer; }

  .panel { position:fixed; z-index:2; pointer-events:none; }
  #head { top:0; left:0; right:0; padding:14px 18px;
          display:flex; gap:22px; align-items:baseline; flex-wrap:wrap; }
  #head h1 { font-size:13px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
  #head .stat { color:var(--dim); }
  #head .stat b { color:var(--ink); font-weight:600; }
  #focus { color:var(--diagnose); pointer-events:auto; cursor:pointer; display:none; }
  #focus.on { display:inline; }
  #state { margin-left:auto; color:var(--dim); }
  /* #head is a .panel, which is pointer-events:none so the globe stays
     draggable underneath; anything clickable in it has to opt back in. */
  #signout { pointer-events:auto; }
  #signout button { background:none; border:0; padding:0; font:inherit;
                    color:var(--dim); cursor:pointer; }
  #signout button:hover { color:var(--ink); }
  #state.live b { color:var(--recovery); }
  #state.down b { color:var(--problem); }

  #legend { bottom:14px; left:18px; display:flex; flex-direction:column; gap:5px; }
  #legend div { color:var(--dim); display:flex; align-items:center; gap:8px; }
  #legend i { width:16px; height:2px; display:inline-block; border-radius:2px; }
  /* The two orbit states are shapes, not colours: a dot with a wake against a
     dot with a stop-ring. Anyone who cannot separate the red from the slate
     still gets the distinction. */
  #legend i.orbiting { height:6px; border-radius:3px;
    background:linear-gradient(to right, rgba(77,100,128,0) 0%, #4d6480 100%); }
  #legend i.halted { height:6px; width:6px; border-radius:50%;
    background:var(--problem); box-shadow:0 0 0 2px rgba(255,77,94,0.35); margin:0 5px; }
  #legend .grouphead { color:var(--ink); margin-top:6px; letter-spacing:.1em;
                       font-size:11px; text-transform:uppercase; }

  /* Deliberately small. At 460x468 this panel covered 5 of 25 workload nodes on
     a 1440x900 screen — measured, not guessed. The globe is the point; the feed
     is a ticker, and a few lines is plenty for one. */
  #feed { bottom:14px; right:18px; width:min(400px,34vw);
          display:flex; flex-direction:column-reverse; gap:2px;
          max-height:22vh; overflow:hidden;
          /* Older lines fade out rather than ending in a hard edge. */
          -webkit-mask-image:linear-gradient(to top, #000 55%, transparent);
          mask-image:linear-gradient(to top, #000 55%, transparent); }
  #feed div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
              opacity:.85; font-size:11px; }
  #feed .t { color:var(--dim); }
  #feed .w { color:var(--ink); }

  #detail { top:60px; right:18px; width:min(320px,28vw); pointer-events:auto;
            background:rgba(10,15,22,0.94); border:1px solid var(--rule);
            border-radius:6px; padding:12px 14px; display:none; }
  #detail.on { display:block; }
  #detail h2 { font-size:12px; font-weight:600; margin-bottom:2px; word-break:break-all;
               padding-right:14px; }
  #detail .ns { color:var(--dim); font-size:11px; margin-bottom:10px; }
  #detail dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:11px; }
  #detail dt { color:var(--dim); }
  #detail .evhead { color:var(--ink); font-size:10px; letter-spacing:.1em;
                    text-transform:uppercase; margin:12px 0 5px; }
  #detail .ev { font-size:11px; color:var(--dim); white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis; }
  #detail .close { position:absolute; top:7px; right:11px; color:var(--dim); cursor:pointer; }
  #detail .close:hover { color:var(--ink); }

  #empty { position:fixed; inset:0; display:grid; place-items:center;
           color:var(--dim); z-index:1; text-align:center; line-height:2; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="head">
  <h1>podsmedic</h1>
  <span class="stat">pods <b id="s-pods">–</b></span>
  <span class="stat">workloads <b id="s-work">–</b></span>
  <span class="stat">problems <b id="s-prob">–</b></span>
  <span class="stat">incidents <b id="s-inc">–</b></span>
  <span id="focus"></span>
  <span class="stat" id="state">feed <b>connecting</b></span>
  <!--SIGNOUT-->
</div>

<div class="panel" id="legend">
  <div class="grouphead">cluster → globe</div>
  <div><i style="background:var(--problem)"></i>failing</div>
  <div><i style="background:var(--restart)"></i>restarted</div>
  <div><i style="background:var(--recovery)"></i>recovered</div>
  <div class="grouphead">globe → workload</div>
  <div><i style="background:var(--diagnose)"></i>diagnosing</div>
  <div><i style="background:var(--heal)"></i>healed</div>
  <div><i style="background:var(--rollback)"></i>rolled back</div>
  <div><i style="background:var(--declined)"></i>declined</div>
  <div class="grouphead">orbit</div>
  <div><i class="orbiting"></i>orbiting — healthy</div>
  <div><i class="halted"></i>stopped — has a problem</div>
</div>

<div class="panel" id="detail"><span class="close" id="d-close">×</span>
  <h2 id="d-name"></h2><div class="ns" id="d-ns"></div>
  <dl id="d-facts"></dl>
  <div class="evhead">recent</div>
  <div id="d-events"></div>
</div>

<div class="panel" id="feed"></div>
<div id="empty">waiting for the first sweep…</div>

<script>
(() => {
  "use strict";

  const COLOR = {
    problem:"#ff4d5e", restart:"#ffab3d", recovery:"#38d996", gone:"#3d4a5c",
    diagnose:"#4aa8ff", heal:"#38d996", verify:"#7ee0b8",
    rollback:"#ffab3d", declined:"#7b8aa0",
  };
  const FROM_PODSMEDIC = new Set(["diagnose","heal","verify","rollback","declined"]);
  // Namespace tints, chosen to stay apart from the event colours, which carry
  // their own meaning and must not be confused with grouping.
  const NS_TINTS = ["#6f8fb5","#a98fc4","#7fb0a0","#c49a6f","#8f9fd0","#b58fa0","#8fb5a8"];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---- the globe -----------------------------------------------------------
  // A Fibonacci sphere: points spaced evenly without clustering at the poles,
  // which is what a naive lat/long grid does. No regions, no landmasses — the
  // globe stands for the cluster, not the Earth.
  const DOTS = (() => {
    const n = 900, pts = [], golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / (n - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = golden * i;
      pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
    }
    return pts;
  })();

  // ---- state ---------------------------------------------------------------
  let workloads = new Map();
  let arcs = [];
  let wires = [];
  let spin = 0, hover = null, selected = null, focusNS = null;
  let sweepAt = 0, sweepIntervalMs = 60000, sweepPulse = 0;
  const MAX_WIRES = 60;

  // Motion is the primary signal on this page, so respecting the OS setting is
  // not decoration. With reduced motion the orbits hold still and colour carries
  // the state on its own — which is also why colour is never the *only* cue for
  // a stopped workload: it gets a halo and a dropped trail too.
  const STILL = window.matchMedia &&
                window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function ringRadius() { return Math.min(W, H) * 0.36; }
  function globeRadius() { return Math.min(W, H) * 0.24; }

  function visible(w) { return !focusNS || w.namespace === focusNS; }

  // A workload stops orbiting when it has an open problem.
  //
  // This is the one thing on the page you can read without looking at it. Colour
  // needs foveal attention and a legend; a single motionless dot among two dozen
  // moving ones is caught by peripheral vision, which is what you actually have
  // spare while doing something else. Degraded-but-not-failing keeps moving —
  // reserving the stop for real failures is what keeps it meaning something.
  function stalled(w) { return (w.problems || 0) > 0; }

  // Each namespace is an orbital shell.
  //
  // The grouping itself is load-bearing and predates the motion: hashing names to
  // angles collided (two workloads 0.0° apart on a real cluster), and plain
  // alphabetical order interleaved namespaces so that on that same cluster 68% of
  // the ring was longhorn-system and kube-system, scattering the handful anyone
  // cared about among infrastructure. One shell per namespace keeps that map and
  // gains a second axis: shells sit at different radii and inclinations, so they
  // stay tellable apart while everything is in motion.
  function shellGeometry(idx, count) {
    const r = ringRadius();
    // Spread the radii, but gently — widely separated shells stop reading as one
    // system and start reading as unrelated rings.
    const spread = count > 1 ? idx / (count - 1) : 0;
    const rx = r * (0.86 + spread * 0.52);
    // Inclination varies too, so two shells of similar radius never trace the
    // same path. Flatter shells cross the globe; rounder ones ride outside it.
    const flatten = 0.26 + ((idx * 0.37) % 1) * 0.5;
    const tilt = (idx * Math.PI) / Math.max(count, 1) + 0.35;
    // Inner shells run faster, as they would if this were physics, and alternate
    // direction so crossings keep changing instead of locking into a pattern.
    const dir = idx % 2 ? -1 : 1;
    const speed = dir * (0.20 - spread * 0.07);
    return { rx, ry: rx * flatten, tilt, speed };
  }

  function relayout() {
    const shown = [...workloads.values()].filter(visible);
    const byNS = new Map();
    for (const w of shown) {
      if (!byNS.has(w.namespace)) byNS.set(w.namespace, []);
      byNS.get(w.namespace).push(w);
    }
    const names = [...byNS.keys()].sort();

    arcs = [];
    names.forEach((ns, idx) => {
      const list = byNS.get(ns).sort((x, y) => x.key.localeCompare(y.key));
      const shell = Object.assign(shellGeometry(idx, names.length), {
        ns, idx, count: list.length, tint: NS_TINTS[idx % NS_TINTS.length],
        // Labels alternate sides so that shells whose inclinations are close do
        // not stack their captions on top of each other.
        labelTheta: idx % 2 ? Math.PI : 0,
      });
      const step = (Math.PI * 2) / list.length;
      list.forEach((w, i) => {
        w.shell = shell;
        // Keep an existing angle across relayouts. A workload appearing or a
        // namespace focus changing must not teleport everything else: the whole
        // point of the motion is that a *stopped* dot is the anomaly, and a
        // general jump would drown that out.
        if (typeof w.angle !== "number") w.angle = step * i;
      });
      arcs.push(shell);
    });
  }

  // advance steps every orbit that is still running. dt is milliseconds, clamped
  // by the caller, so a backgrounded tab resumes rather than teleporting.
  function advance(dt) {
    if (STILL) return;
    const s = dt / 1000;
    for (const w of workloads.values()) {
      if (!w.shell || stalled(w)) continue;
      w.angle = (w.angle + w.shell.speed * s) % (Math.PI * 2);
    }
  }

  function setWorkloads(list) {
    const next = new Map();
    for (const w of list || []) {
      const prev = workloads.get(w.key);
      // angle has to survive the snapshot poll. The API does not send one, so
      // without carrying it forward every orbit would snap back to its starting
      // slot once a minute — which reads as the whole cluster twitching, and
      // buries the one signal this view exists for.
      next.set(w.key, Object.assign({ events: prev ? prev.events : [],
                                      lit: prev ? prev.lit : 0,
                                      angle: prev ? prev.angle : undefined }, w));
    }
    workloads = next;
    relayout();
    document.getElementById("s-work").textContent = workloads.size;
    document.getElementById("empty").style.display = workloads.size ? "none" : "grid";
    if (selected && !workloads.has(selected)) closeDetail();
    else if (selected) renderDetail();
  }

  // An event about something the last sweep did not list still deserves a wire —
  // a pod can appear and fail between sweeps.
  function ensureWorkload(ev) {
    const key = ev.workload ? ev.namespace + "/" + ev.workload : ev.namespace + "/" + ev.pod;
    if (!workloads.has(key)) {
      workloads.set(key, {
        key, namespace: ev.namespace, name: ev.workload || ev.pod,
        pods: 1, ready: 0, problems: 0, events: [], lit: 0,
      });
      relayout();
      document.getElementById("s-work").textContent = workloads.size;
      document.getElementById("empty").style.display = "none";
    }
    return key;
  }

  function addWire(ev) {
    const key = ensureWorkload(ev);
    const w = workloads.get(key);
    w.lit = performance.now();
    w.events.unshift(ev);
    if (w.events.length > 8) w.events.pop();
    if (ev.class === "problem") w.problems = (w.problems || 0) + 1;
    if (ev.class === "recovery") w.problems = Math.max(0, (w.problems || 0) - 1);
    if (selected === key) renderDetail();

    if (!visible(w)) return; // focused elsewhere: record it, do not draw it
    wires.push({
      key,
      color: COLOR[ev.class] || "#7b8aa0",
      inbound: FROM_PODSMEDIC.has(ev.class),
      born: performance.now(),
      life: FROM_PODSMEDIC.has(ev.class) ? 3400 : 2800,
    });
    if (wires.length > MAX_WIRES) wires = wires.slice(-MAX_WIRES);
  }

  // ---- geometry ------------------------------------------------------------

  // A point on a shell: an ellipse, rotated by the shell's inclination.
  function orbitXY(shell, theta) {
    const cx = W / 2, cy = H / 2;
    const ux = Math.cos(theta) * shell.rx, uy = Math.sin(theta) * shell.ry;
    const c = Math.cos(shell.tilt), s = Math.sin(shell.tilt);
    return [cx + ux * c - uy * s, cy + ux * s + uy * c];
  }

  // Depth along the shell, +1 nearest the viewer and −1 furthest. The flattened
  // axis is the one pointing at the camera, so this is just sin(theta) — and it
  // is what lets a particle pass in front of the globe on one half of its orbit
  // and behind it on the other. Without that the whole thing reads as a flat
  // ring with things sliding around it.
  function orbitDepth(theta) { return Math.sin(theta); }

  function workloadXY(w) {
    if (!w.shell) return [W / 2, H / 2];
    return orbitXY(w.shell, w.angle);
  }

  // Node radius carries the replica count. Square-rooted and capped, so a
  // 30-replica Deployment does not swallow its neighbours.
  function nodeRadius(w) {
    return Math.min(3.2 + Math.sqrt(Math.max(w.pods || 1, 1)) * 1.5, 11);
  }

  // ---- drawing -------------------------------------------------------------
  function drawGlobe() {
    const cx = W / 2, cy = H / 2, R = globeRadius();
    spin += 0.0016;

    const glow = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.7);
    glow.addColorStop(0, "rgba(74,168,255,0.13)");
    glow.addColorStop(1, "rgba(74,168,255,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.7, 0, Math.PI * 2); ctx.fill();

    // A faint limb. Dots alone read as a cloud; one circle at the silhouette is
    // what makes the eye resolve them into a surface.
    ctx.strokeStyle = "rgba(74,168,255,0.16)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

    const cosS = Math.cos(spin), sinS = Math.sin(spin);
    const tilt = 0.42, cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    const CAM = 3.2;

    for (const [x0, y0, z0] of DOTS) {
      const x1 = x0 * cosS + z0 * sinS;
      const z1 = -x0 * sinS + z0 * cosS;
      const y2 = y0 * cosT - z1 * sinT;
      const z2 = y0 * sinT + z1 * cosT;

      const k = CAM / (CAM - z2);            // weak perspective
      const px = cx + x1 * R * k, py = cy + y2 * R * k;
      const depth = (z2 + 1) / 2;
      const alpha = z2 < 0 ? 0.10 + depth * 0.22 : 0.34 + depth * 0.62;
      const size = (z2 < 0 ? 0.6 : 0.9 + depth * 1.3) * k * 0.85;

      ctx.fillStyle = `rgba(126,196,255,${alpha.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI * 2); ctx.fill();
    }
  }

  // The heartbeat. Without it a healthy cluster is a completely static picture,
  // and "everything is fine" looks exactly like "the feed died".
  function drawHeartbeat(now) {
    const cx = W / 2, cy = H / 2, R = globeRadius();
    const ring = R * 1.14;

    ctx.strokeStyle = "rgba(74,168,255,0.09)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, ring, 0, Math.PI * 2); ctx.stroke();

    // Progress toward the next sweep, advanced from the local clock so it moves
    // smoothly between snapshot polls.
    if (sweepAt) {
      const p = Math.min((Date.now() - sweepAt) / sweepIntervalMs, 1);
      ctx.strokeStyle = "rgba(126,196,255,0.42)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, ring, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
      ctx.stroke();
    }

    if (sweepPulse) {
      const p = (now - sweepPulse) / 1400;
      if (p >= 1) sweepPulse = 0;
      else {
        ctx.strokeStyle = `rgba(126,196,255,${(0.34 * (1 - p)).toFixed(3)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy, ring + p * R * 0.9, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  // The orbit paths, drawn very faint. They exist to make the motion legible as
  // orbits rather than as drift, and to group a namespace visually — so they
  // must stay quieter than the particles riding them, or the page becomes a
  // diagram of ellipses with some dots in it.
  function drawShells() {
    const cx = W / 2, cy = H / 2;
    for (const shell of arcs) {
      const focused = shell.ns === focusNS;
      ctx.strokeStyle = shell.tint + (focused ? "66" : "30");
      ctx.lineWidth = focused ? 1.3 : 1;
      ctx.beginPath();
      ctx.ellipse(cx, cy, shell.rx, shell.ry, shell.tilt, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawShellLabels() {
    const cx = W / 2, cy = H / 2;
    for (const shell of arcs) {
      // Pinned to a fixed point on the shell rather than following any
      // particular workload: a caption that moved would be unreadable, and
      // unclickable.
      const [lx0, ly0] = orbitXY(shell, shell.labelTheta);
      const ox = lx0 - cx, oy = ly0 - cy;
      const len = Math.hypot(ox, oy) || 1;
      const lx = cx + (ox / len) * (len + 26), ly = cy + (oy / len) * (len + 26);

      // A leader line back to the orbit it names. With seven inclined ellipses
      // crossing each other, a caption floating near the outside is ambiguous —
      // measured on the real cluster, you cannot tell which ring "longhorn-system"
      // belongs to. The line costs two pixels and removes the guess.
      ctx.strokeStyle = shell.tint + (shell.ns === focusNS ? "99" : "55");
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(lx0, ly0); ctx.lineTo(lx, ly); ctx.stroke();

      const stopped = [...workloads.values()]
        .filter((w) => w.namespace === shell.ns && visible(w) && stalled(w)).length;
      const label = shell.ns + " · " + shell.count + (stopped ? "  ⏸" + stopped : "");

      ctx.font = "10px ui-monospace,Menlo,monospace";
      const right = lx >= cx;
      ctx.textAlign = right ? "left" : "right";
      const tw = ctx.measureText(label).width;
      shell.hit = { x: lx, y: ly, w: tw, right };

      ctx.fillStyle = "rgba(7,10,15,0.78)";
      ctx.fillRect(right ? lx - 4 : lx - tw - 4, ly - 8, tw + 8, 16);
      ctx.fillStyle = shell.ns === focusNS ? "#e6eefc" : (stopped ? "#ff8a95" : shell.tint);
      ctx.fillText(label, lx, ly + 3.5);
    }
  }

  function shortName(name) {
    const i = name.indexOf("/");
    return i >= 0 ? name.slice(i + 1) : name;
  }

  // TRAIL_N segments of wake behind each moving particle. Enough to read as
  // motion at a glance; few enough that two dozen of them stay cheap.
  const TRAIL_N = 8, TRAIL_STEP = 0.055;

  // drawWorkloads runs twice per frame — once for the half of each orbit behind
  // the globe, once for the half in front — so the globe occludes what is behind
  // it. `front` selects which pass this is.
  function drawWorkloads(now, front) {
    for (const w of workloads.values()) {
      if (!visible(w) || !w.shell) continue;
      const z = orbitDepth(w.angle);
      if ((z >= 0) !== front) continue;

      const [x, y] = workloadXY(w);
      const stopped = stalled(w);
      // Pods that finished successfully are not missing replicas. Without this a
      // completed Job reads as a permanently degraded workload.
      const serving = (w.pods || 0) - (w.done || 0);
      const degraded = serving > 0 && (w.ready || 0) < serving;
      const active = w.lit && now - w.lit < 6000;
      const hovered = hover === w.key, chosen = selected === w.key;

      // Perspective: nearer particles are bigger and brighter. Applied to the
      // radius rather than to a scale transform so hit-testing stays honest.
      const near = (z + 1) / 2;
      const depthScale = 0.74 + near * 0.34;
      const rad = nodeRadius(w) * depthScale;
      const dim = front ? 1 : 0.45 + near * 0.25;

      let color = "#4d6480";
      if (stopped) color = "#ff4d5e";
      else if (degraded) color = "#ffab3d";

      // The wake. A stopped workload has none, and its absence is the signal:
      // every neighbour is a comet and this one is a full stop.
      if (!stopped && !STILL) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i <= TRAIL_N; i++) {
          const t = w.angle - i * TRAIL_STEP * Math.sign(w.shell.speed);
          const [tx2, ty2] = orbitXY(w.shell, t);
          const k = 1 - i / (TRAIL_N + 1);
          ctx.globalAlpha = k * k * 0.5 * dim;
          ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(tx2, ty2, rad * k * 0.72, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      // A dark disc under the particle, so one crossing the globe's dot field
      // still reads as a distinct object rather than a bright patch of surface.
      if (front) {
        ctx.fillStyle = "rgba(7,10,15,0.72)";
        ctx.beginPath(); ctx.arc(x, y, rad + 2.4, 0, Math.PI * 2); ctx.fill();
      }

      if (stopped) {
        // Two static rings rather than a pulse. A stopped thing that throbs
        // still reads as alive, which is exactly the wrong impression.
        ctx.strokeStyle = "rgba(255,77,94,0.55)";
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(x, y, rad + 5, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "rgba(255,77,94,0.22)";
        ctx.beginPath(); ctx.arc(x, y, rad + 9.5, 0, Math.PI * 2); ctx.stroke();
      } else if (active) {
        const pulse = rad + 5 + Math.sin(now / 380) * 2;
        ctx.strokeStyle = `rgba(120,200,255,${(0.30 * dim).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, pulse, 0, Math.PI * 2); ctx.stroke();
      }
      if (chosen) {
        ctx.strokeStyle = "rgba(230,238,252,0.75)";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, rad + 4, 0, Math.PI * 2); ctx.stroke();
      }

      ctx.globalAlpha = dim;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;

      // Labels cannot all fit — measured on a real 24-workload cluster, 3858px
      // of text around a 2565px ring. So label what a viewer is looking for:
      // anything stopped or degraded, anything that just did something, the
      // selection, and whatever the pointer is near.
      if (!(stopped || degraded || active || hovered || chosen)) continue;

      const label = shortName(w.name) + (w.pods > 1 ? " ×" + w.pods : "");
      const right = x >= W / 2;
      ctx.font = (hovered || chosen) ? "600 11px ui-monospace,Menlo,monospace"
                                     : "10px ui-monospace,Menlo,monospace";
      ctx.textAlign = right ? "left" : "right";
      const tx = x + (right ? rad + 7 : -(rad + 7));
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(7,10,15,0.72)";
      ctx.fillRect(right ? tx - 3 : tx - tw - 3, y - 7, tw + 6, 14);
      ctx.fillStyle = stopped ? "#ffb3ba"
                    : (hovered || chosen) ? "#e6eefc" : "rgba(200,212,228,0.78)";
      ctx.fillText(label, tx, y + 3.5);
    }
  }

  function drawWires(now) {
    const cx = W / 2, cy = H / 2, R = globeRadius();
    wires = wires.filter((wire) => now - wire.born < wire.life);

    // Additive blending: overlapping wires brighten instead of muddying, which
    // is what makes several at once read as light rather than a tangle.
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    for (const wire of wires) {
      const w = workloads.get(wire.key);
      if (!w || !visible(w)) continue;
      const [x, y] = workloadXY(w);
      const p = (now - wire.born) / wire.life;
      const fade = p < 0.12 ? p / 0.12 : 1 - (p - 0.12) / 0.88;

      // Start at the globe's limb rather than dead centre. A line drawn through
      // 900 dots loses its inner half in the noise; leaving the sphere gives it
      // a clean origin and makes the direction legible from the first pixel.
      const dx = x - cx, dy = y - cy;
      const len0 = Math.hypot(dx, dy) || 1;
      const sx = cx + (dx / len0) * R * 1.04;
      const sy = cy + (dy / len0) * R * 1.04;

      // Bow the line away from centre so overlapping wires stay legible.
      const mx = (sx + x) / 2, my = (sy + y) / 2;
      const nx = -dy, ny = dx;
      const bow = Math.min(W, H) * 0.055;
      const bx = mx + (nx / len0) * bow, by = my + (ny / len0) * bow;

      const at = (t) => {
        const u = (1 - t) * (1 - t), v = 2 * (1 - t) * t, s2 = t * t;
        return [u * sx + v * bx + s2 * x, u * sy + v * by + s2 * y];
      };

      // The line itself: a soft wide pass under a bright narrow one.
      ctx.strokeStyle = wire.color;
      ctx.globalAlpha = 0.10 + fade * 0.22;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(bx, by, x, y); ctx.stroke();

      ctx.globalAlpha = 0.22 + fade * 0.68;
      ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(bx, by, x, y); ctx.stroke();

      // A comet, not a dot. The tail is what makes the direction unmistakable
      // at a glance: outward when podsmedic acts on a workload, inward when the
      // cluster reports something. That direction is the whole grammar — it
      // says who did what to whom.
      const q = wire.inbound ? p : 1 - p;
      for (let i = 0; i < 6; i++) {
        // Trail behind the head, which means the opposite way for each direction.
        const back = i * 0.045 * (wire.inbound ? -1 : 1);
        const t = Math.min(Math.max(q + back, 0), 1);
        const [px, py] = at(t);
        ctx.globalAlpha = fade * (1 - i / 6) * 0.9;
        ctx.fillStyle = wire.color;
        ctx.beginPath(); ctx.arc(px, py, 3.4 - i * 0.42, 0, Math.PI * 2); ctx.fill();
      }

      // A flash where the pulse lands, so an arrival is a moment rather than a
      // fade-out nobody notices.
      const arrived = wire.inbound ? p > 0.82 : p > 0.82;
      if (arrived) {
        const [ex, ey] = wire.inbound ? [sx, sy] : [x, y];
        const k = (p - 0.82) / 0.18;
        ctx.globalAlpha = (1 - k) * 0.55;
        ctx.strokeStyle = wire.color;
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(ex, ey, 5 + k * 14, 0, Math.PI * 2); ctx.stroke();
      }
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  let lastFrame = 0;
  function frame() {
    const now = performance.now();
    // Clamped: a backgrounded tab stops receiving frames, and without this the
    // first frame back would jump every orbit by however long you were away.
    const dt = lastFrame ? Math.min(now - lastFrame, 120) : 16;
    lastFrame = now;
    advance(dt);

    ctx.clearRect(0, 0, W, H);
    drawShells();
    // Back half first, then the globe over it, then the front half — which is
    // what turns a flat ellipse into something going round the sphere.
    drawWorkloads(now, false);
    drawGlobe();
    drawHeartbeat(now);
    drawWires(now);
    drawWorkloads(now, true);
    drawShellLabels();
    requestAnimationFrame(frame);
  }

  // ---- detail panel --------------------------------------------------------
  const detail = document.getElementById("detail");

  function renderDetail() {
    const w = workloads.get(selected);
    if (!w) { closeDetail(); return; }
    document.getElementById("d-name").textContent = w.name;
    document.getElementById("d-ns").textContent = w.namespace;

    const dl = document.getElementById("d-facts");
    dl.replaceChildren();
    for (const [k, v] of [
      ["pods", String(w.pods ?? "–")],
      ["ready", (w.ready ?? 0) + " / " + ((w.pods ?? 0) - (w.done ?? 0))],
      ...(w.done ? [["completed", String(w.done)]] : []),
      ["problems", String(w.problems || 0)],
    ]) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      dl.append(dt, dd);
    }

    const box = document.getElementById("d-events");
    box.replaceChildren();
    if (!w.events.length) {
      const d = document.createElement("div");
      d.className = "ev"; d.textContent = "nothing yet";
      box.append(d);
    }
    for (const ev of w.events) {
      const d = document.createElement("div");
      d.className = "ev";
      const c = document.createElement("span");
      c.style.color = COLOR[ev.class] || "#7b8aa0";
      c.textContent = ev.class + " ";
      d.append(c, document.createTextNode(ev.detail || ev.reason || ""));
      box.append(d);
    }
    detail.classList.add("on");
  }

  function closeDetail() { selected = null; detail.classList.remove("on"); }
  document.getElementById("d-close").addEventListener("click", closeDetail);

  // ---- focus ---------------------------------------------------------------
  const focusEl = document.getElementById("focus");
  function setFocus(ns) {
    focusNS = ns;
    focusEl.textContent = ns ? "focus: " + ns + "  ✕" : "";
    focusEl.classList.toggle("on", !!ns);
    wires = [];        // wires belong to the old layout; their endpoints moved
    relayout();
  }
  focusEl.addEventListener("click", () => setFocus(null));

  // ---- pointer -------------------------------------------------------------
  function nodeAt(mx, my) {
    let best = null, bestD = 20 * 20;
    for (const w of workloads.values()) {
      if (!visible(w)) continue;
      const [x, y] = workloadXY(w);
      const d = (x - mx) * (x - mx) + (y - my) * (y - my);
      if (d < bestD) { bestD = d; best = w.key; }
    }
    return best;
  }

  // Hit-testing a moving target. The node radius already grows with depth, so
  // the generous 20px slop here is what keeps a particle clickable while it is
  // on the far side of its orbit and drawn small.
  function arcLabelAt(mx, my) {
    for (const a of arcs) {
      const h = a.hit;
      if (!h) continue;
      const l = h.right ? h.x - 4 : h.x - h.w - 4;
      if (mx >= l && mx <= l + h.w + 8 && my >= h.y - 8 && my <= h.y + 8) return a.ns;
    }
    return null;
  }

  canvas.addEventListener("mousemove", (e) => {
    hover = nodeAt(e.clientX, e.clientY);
    canvas.classList.toggle("pick", !!(hover || arcLabelAt(e.clientX, e.clientY)));
  });
  canvas.addEventListener("mouseleave", () => { hover = null; });

  canvas.addEventListener("click", (e) => {
    const ns = arcLabelAt(e.clientX, e.clientY);
    if (ns) { setFocus(ns === focusNS ? null : ns); return; }
    const key = nodeAt(e.clientX, e.clientY);
    if (key) { selected = key; renderDetail(); } else closeDetail();
  });

  // ---- feed ----------------------------------------------------------------
  const feed = document.getElementById("feed");
  function logEvent(ev) {
    const row = document.createElement("div");
    const when = new Date(ev.at || Date.now());
    const pad = (n) => String(n).padStart(2, "0");

    const t = document.createElement("span");
    t.className = "t";
    t.textContent = `${pad(when.getHours())}:${pad(when.getMinutes())}:${pad(when.getSeconds())} `;
    const c = document.createElement("span");
    c.style.color = COLOR[ev.class] || "#7b8aa0";
    c.textContent = (ev.class + "        ").slice(0, 9);
    const w = document.createElement("span");
    w.className = "w";
    w.textContent = " " + (ev.workload || ev.pod || ev.namespace) + " ";
    const d = document.createElement("span");
    d.className = "t"; d.textContent = ev.detail || ev.reason || "";

    row.append(t, c, w, d);
    feed.prepend(row);
    while (feed.childElementCount > 8) feed.lastElementChild.remove();
  }

  function setStat(id, v) { document.getElementById(id).textContent = v; }
  function setState(text, cls) {
    const el = document.getElementById("state");
    el.className = cls; el.innerHTML = "feed <b>" + text + "</b>";
  }

  // ---- data ----------------------------------------------------------------
  async function loadSnapshot() {
    try {
      const r = await fetch("api/snapshot", {cache: "no-store"});
      const s = await r.json();
      setStat("s-pods", s.pods ?? "–");
      setStat("s-prob", s.problems ?? "–");
      setStat("s-inc", s.incidents ?? "–");
      if (s.intervalSec) sweepIntervalMs = s.intervalSec * 1000;
      if (typeof s.sweepAgeSec === "number") sweepAt = Date.now() - s.sweepAgeSec * 1000;
      setWorkloads(s.workloads);
      feed.replaceChildren();
      for (const ev of (s.events || [])) logEvent(ev);
    } catch (e) {
      setState("snapshot failed", "down");
    }
  }

  function connect() {
    const src = new EventSource("api/events");
    src.onopen = () => setState("live", "live");
    src.onmessage = (m) => {
      let ev; try { ev = JSON.parse(m.data); } catch { return; }
      if (ev.class === "sweep") {
        // Heartbeat, not a wire: no workload to draw to, nothing to log.
        sweepAt = Date.now();
        sweepPulse = performance.now();
        return;
      }
      addWire(ev);
      logEvent(ev);
    };
    src.onerror = () => setState("reconnecting", "down");
  }

  // Exposes where the nodes really are, so a layout check measures the drawing
  // rather than a copy of its arithmetic. Read-only and side-effect free.
  window.__podsmedicNodes = () =>
    [...workloads.values()].filter(visible).map((w) => {
      const [x, y] = workloadXY(w);
      return { key: w.key, x, y, angle: w.angle, stalled: stalled(w),
               shell: w.shell ? w.shell.ns : null };
    });

  resize();
  loadSnapshot();
  setInterval(loadSnapshot, 30000);
  connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
